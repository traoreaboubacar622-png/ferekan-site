<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/favicon-192.png">
<meta name="apple-mobile-web-app-title" content="Ferekan">
<meta name="theme-color" content="#0B6E4F">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferekan</title>
<meta name="robots" content="noindex">
<style>
  :root { --g:#0B6E4F; --o:#F2A33A; --ink:#14181F; --muted:#5B6270; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:#F4F5F7; }
  main { max-width: 480px; margin: 0 auto; min-height: 100vh; background:#fff; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid #E4E6EA; }
  header svg { width:32px; height:32px; }
  header strong { font-size:20px; color:var(--g); }
  .photo { width:100%; aspect-ratio: 1/1; object-fit:cover; background:#FDE7C8; display:block; }
  .body { padding:20px 18px; display:flex; flex-direction:column; gap:8px; }
  h1 { margin:0; font-size:24px; }
  .price { font-size:24px; font-weight:800; color:var(--g); }
  .shop { color:var(--muted); font-size:15px; }
  .actions { padding:18px; display:flex; flex-direction:column; gap:10px; margin-top:auto; }
  a.btn { display:flex; align-items:center; justify-content:center; height:54px; border-radius:14px; font-weight:700; font-size:16px; text-decoration:none; }
  a.primary { background:var(--g); color:#fff; }
  a.secondary { border:1.5px solid var(--g); color:var(--g); }
  p.note { margin:0; text-align:center; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <header>
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <path d="M44 38V30a16 16 0 0 1 32 0v8" fill="none" stroke="#0B6E4F" stroke-width="7" stroke-linecap="round"/>
      <rect x="18" y="36" width="84" height="62" rx="16" fill="#0B6E4F"/>
      <path d="M28 94 20 112 46 97Z" fill="#0B6E4F"/>
      <rect x="39" y="59" width="7" height="16" rx="3.5" fill="#F2A33A"/>
      <rect x="51" y="51" width="7" height="32" rx="3.5" fill="#F2A33A"/>
      <rect x="63" y="55" width="7" height="24" rx="3.5" fill="#F2A33A"/>
      <rect x="75" y="61" width="7" height="12" rx="3.5" fill="#F2A33A"/>
    </svg>
    <strong>Ferekan</strong>
  </header>
  <img class="photo" id="photo" alt="">
  <div class="body">
    <h1 id="title">Produit</h1>
    <div class="price" id="price"></div>
    <div class="shop" id="shop"></div>
  </div>
  <div class="actions">
    <a class="btn primary" id="open">Discuter avec le vendeur sur Ferekan</a>
    <a class="btn secondary" id="download">Télécharger l’application</a>
    <p class="note" id="webnote" style="display:none">ou <a id="weblink" style="color:var(--g);font-weight:700">continuer sur la version web</a>, sans rien installer</p>
    <p class="note">Achetez et discutez avec les commerçants, même en vocal.</p>
  </div>
</main>
<script>
  // Téléchargement Android : APK tant que Ferekan n'est pas publiée sur le Play Store.
  // Au lancement public : mettre PLAY_STORE_PUBLIC = true.
  var PLAY_STORE_PUBLIC = false;
  var PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.ferekan.app';
  var APK_URL = 'https://github.com/traoreaboubacar622-png/ferekan-site/releases/latest';
  var DOWNLOAD_URL = PLAY_STORE_PUBLIC ? PLAY_STORE_URL : APK_URL;
  var ANDROID_PACKAGE = 'com.ferekan.app';

  var q = new URLSearchParams(location.search);
  var title = q.get('t') || 'Produit Ferekan';
  var price = parseInt(q.get('p') || '', 10);
  var shopName = q.get('n') || '';
  var img = q.get('i') || '';
  var shopId = (q.get('shop') || '').replace(/[^a-zA-Z0-9-]/g, '');
  var productId = (q.get('product') || '').replace(/[^a-zA-Z0-9-]/g, '');
  // Service (coiffure, couture…) : prix « à partir de » ou « sur devis », bouton « Réserver »
  var serviceId = (q.get('service') || '').replace(/[^a-zA-Z0-9-]/g, '');

  // textContent : aucun HTML injecté depuis l'adresse
  document.getElementById('title').textContent = title;
  document.title = title + ' · Ferekan';
  if (serviceId) {
    document.getElementById('price').textContent = !isNaN(price) ? 'À partir de ' + price.toLocaleString('fr-FR') + ' FCFA' : 'Prix sur devis';
    if (shopName) document.getElementById('shop').textContent = 'Proposé par ' + shopName;
    document.getElementById('open').textContent = 'Réserver sur Ferekan';
    document.querySelectorAll('.note')[1].textContent = 'Demandez un rendez-vous ou un prix et discutez avec le prestataire, même en vocal.';
  } else {
    if (!isNaN(price)) document.getElementById('price').textContent = price.toLocaleString('fr-FR') + ' FCFA';
    if (shopName) document.getElementById('shop').textContent = 'Vendu par ' + shopName;
  }
  var photo = document.getElementById('photo');
  if (/^https:\/\//.test(img)) { photo.src = img; photo.alt = title; } else { photo.style.display = 'none'; }

  // Lien de boutique (sans produit) : textes adaptés
  if (!productId && !serviceId && shopId) {
    document.getElementById('shop').textContent = 'Boutique sur Ferekan';
    document.getElementById('open').textContent = 'Voir la boutique sur Ferekan';
  }

  var path = serviceId ? 'service/' + serviceId : productId ? 'product/' + productId : (shopId ? 'shop/' + shopId : '');
  var deepLink = 'ferekan://' + path;
  // Version web de Ferekan (même produit), en adresse complète
  var webLink = new URL('../app/' + path, location.href).href;

  var ua = navigator.userAgent;
  var isIos = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var open = document.getElementById('open');
  var dl = document.getElementById('download');
  dl.href = DOWNLOAD_URL;

  if (isAndroid) {
    // Lien Android « intelligent » : ouvre l'app Ferekan si elle est installée
    // (même depuis Facebook / Instagram), sinon la version web sur le même produit.
    open.href = 'intent://' + path + '#Intent;scheme=ferekan;package=' + ANDROID_PACKAGE +
      ';S.browser_fallback_url=' + encodeURIComponent(webLink) + ';end';
    if (!PLAY_STORE_PUBLIC) {
      // Tant que l'APK vient de GitHub, on met en avant la version web (aucune installation)
      document.getElementById('weblink').href = webLink;
      document.getElementById('webnote').style.display = 'block';
    }
  } else if (isIos) {
    // iPhone / iPad : version web de Ferekan (installable sur l'écran d'accueil)
    open.href = webLink;
    dl.href = new URL('../app/', location.href).href;
    dl.textContent = 'Installer Ferekan sur iPhone';
  } else {
    // Ordinateur : version web
    open.href = webLink;
    dl.textContent = 'Télécharger l’application Android';
  }
</script>
</body>
</html>
