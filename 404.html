<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferekan</title>
<script>
  // Lien direct ou rechargement d'une page de l'app (ex. /app/seller/videos) :
  // GitHub Pages ne connaît pas ces adresses -> on rouvre l'app et on y retourne.
  (function () {
    var p = location.pathname;
    var i = p.indexOf('/app/');
    if (i >= 0) {
      var base = p.slice(0, i + 5);
      var route = '/' + p.slice(i + 5);
      location.replace(base + '?r=' + encodeURIComponent(route + location.search) + location.hash);
    }
  })();
</script>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; background: #F4F5F7; color: #1F2430; text-align: center; padding: 24px; }
  a { display: inline-block; margin-top: 16px; background: #0B6E4F; color: #fff; padding: 14px 22px; border-radius: 14px; text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
  <div>
    <h1>Page introuvable</h1>
    <p>Cette page n’existe pas ou a été déplacée.</p>
    <a href="https://ferekan.com/">Retour à Ferekan</a>
  </div>
</body>
</html>
